	<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAO 2026 | Support Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --ekiti-green: #006400;
            --ekiti-light: #e9f5e9;
            --gold: #FFD700;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f4f7f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: var(--white);
            padding: 2.5rem;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 480px;
            width: 92%;
            border-top: 12px solid var(--ekiti-green);
        }

        h1 { margin: 0; color: var(--ekiti-green); font-size: 2.5rem; font-weight: 900; }
        .subtitle { color: #555; margin-bottom: 2rem; font-weight: 500; }

        .counter-box {
            background: var(--ekiti-light);
            padding: 2.5rem;
            border-radius: 25px;
            margin-bottom: 2rem;
            border: 2px solid rgba(0,100,0,0.05);
        }

        #count-display {
            font-size: 5rem;
            font-weight: 900;
            color: var(--ekiti-green);
            margin: 0;
            letter-spacing: -2px;
        }

        .label {
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.75rem;
            color: #666;
            margin-top: 10px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 18px;
            margin-bottom: 1.5rem;
            border-radius: 15px;
            border: 2px solid #ddd;
            font-size: 1.1rem;
            appearance: none;
            background: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") no-repeat right 15px center/20px;
        }

        #vote-btn {
            background: var(--ekiti-green);
            color: white;
            padding: 1.3rem;
            font-size: 1.3rem;
            font-weight: 800;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #vote-btn:hover:not(:disabled) { background: #004d00; transform: scale(1.03); }
        #vote-btn:disabled { background: #bbb; }

        #status-msg {
            margin-top: 1.5rem;
            font-weight: 700;
            color: var(--ekiti-green);
        }

        .footer { margin-top: 2.5rem; font-size: 0.75rem; color: #999; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="card">
    <h1>BAO 2026</h1>
    <p class="subtitle">Continuity of Shared Prosperity</p>

    <div class="counter-box">
        <h2 id="count-display">0</h2>
        <div class="label">Total Support Votes</div>
    </div>

    <select id="lga-select">
        <option value="Ado-Ekiti">Ado-Ekiti</option>
        <option value="Ikere">Ikere</option>
        <option value="Oye">Oye</option>
        <option value="Ijero">Ijero</option>
        <option value="Ikole">Ikole</option>
        <option value="Moba">Moba</option>
        <option value="Ido/Osi">Ido/Osi</option>
        <option value="Ekiti West">Ekiti West</option>
        <option value="Ekiti East">Ekiti East</option>
        <option value="Ekiti South-West">Ekiti South-West</option>
        <option value="Irepodun/Ifelodun">Irepodun/Ifelodun</option>
        <option value="Efon">Efon</option>
        <option value="Ilejemeje">Ilejemeje</option>
        <option value="Ise/Orun">Ise/Orun</option>
        <option value="Emure">Emure</option>
        <option value="Gbonyin">Gbonyin</option>
    </select>

    <button id="vote-btn">SUPPORT PROGRESS</button>
    <p id="status-msg"></p>

    <div class="footer">
        POWERED BY BRIGHT TECHNOLOGIES<br>
        FOUNTAIN OF KNOWLEDGE LAB
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://gpnwvuyorphfuhcbdlbn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdwbnd2dXlvcnBoZnVoY2JkbGJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MTQ4ODQsImV4cCI6MjA5Mjk5MDg4NH0._omrZAui0kMX2aEXN6KSKv3rcf4OYJYy9iyRaCZHBck';
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 1. Initial Load and Polling Fallback (Every 10 seconds just in case)
    async function refreshCount() {
        const { data, error } = await _supabase
            .from('campaign_stats')
            .select('vote_count');
        
        if (data) {
            const total = data.reduce((acc, curr) => acc + (curr.vote_count || 0), 0);
            document.getElementById('count-display').innerText = total.toLocaleString();
        }
    }

    // 2. Realtime Listener (Specific to Ireland/EU-West Region Settings)
    const channel = _supabase
        .channel('db-changes')
        .on('postgres_changes', 
            { event: 'UPDATE', schema: 'public', table: 'campaign_stats' }, 
            (payload) => {
                console.log('Change received!', payload);
                refreshCount();
            }
        )
        .subscribe();

    // 3. Vote Logic
    document.getElementById('vote-btn').onclick = async () => {
        if (localStorage.getItem('bao_2026_done')) {
            document.getElementById('status-msg').innerText = "Already supported! Forward Ekiti!";
            return;
        }

        const lga = document.getElementById('lga-select').value;
        const btn = document.getElementById('vote-btn');
        btn.disabled = true;

        try {
            // Get IP for the SQL function
            const ipFetch = await fetch('https://api.ipify.org?format=json');
            const { ip } = await ipFetch.json();

            // Run the SQL Function (RPC)
            const { data, error } = await _supabase.rpc('record_bao_vote', { 
                target_lga: lga,
                user_ip: ip 
            });

            if (data.success) {
                localStorage.setItem('bao_2026_done', 'true');
                document.getElementById('status-msg').innerText = "Record saved for " + lga + "!";
                refreshCount();
            } else {
                document.getElementById('status-msg').innerText = data.message;
            }
        } catch (e) {
            document.getElementById('status-msg').innerText = "Network busy. Try again!";
            btn.disabled = false;
        }
    };

    // Run on start
    refreshCount();
    setInterval(refreshCount, 10000); 
</script>

</body>
</html>
